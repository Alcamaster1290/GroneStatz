name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build backend image
      run: docker build FantasyL1-2026/backend --tag gronestatz-backend:$(date +%s)
    - name: Build frontend image
      run: docker build FantasyL1-2026/frontend --tag gronestatz-frontend:$(date +%s)
